<!DOCTYPE html>
<html>
<head>
  <title>LinkedIn Comment Scraper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>LinkedIn Comment Scraper</h2>
    <input type="text" id="keywordInput" placeholder="Filter by keyword (optional)" class="keyword-input">
    <div class="button-row">
      <button id="scrapeButton">Scrape Comments</button>
      <button id="stopButton" class="stop-button" style="display: none;">Stop</button>
    </div>
    <div class="button-row" id="actionButtons" style="display: none;">
      <button id="downloadButton" class="download-button">Download CSV</button>
      <button id="sheetsButton" class="sheets-button">Open in Sheets</button>
    </div>
    
    <div id="loadingSpinner" class="spinner" style="display: none;"></div>
    <p id="status">Click the button to scrape comments.</p>
    <p id="resultSummary" class="result-summary" style="display: none;"></p>
    
    <div class="log-container">
      <h3>Log</h3>
      <div id="logContent" class="log-content"></div>
    </div>
    
    <div class="footer">
      <p>Make sure you're on a LinkedIn post with comments.</p>
      <p><small>If scraping doesn't work, LinkedIn may have updated their page structure.</small></p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
